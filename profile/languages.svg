<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 140" width="400" height="140">
  <defs>
    <filter id="glow">
      <feGaussianBlur stdDeviation="1.5" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <pattern id="scanlines" x="0" y="0" width="400" height="4" patternUnits="userSpaceOnUse">
      <rect x="0" y="0" width="400" height="1" fill="#000000" opacity="0.1"/>
    </pattern>
  </defs>
  
  <rect width="400" height="140" fill="#0D1117" rx="12" stroke="#30363D" stroke-width="1" />
  <rect width="400" height="140" fill="url(#scanlines)" rx="12" />
  
  <!-- Corners decorativos estilo circuito -->
  <rect x="15" y="15" width="10" height="10" fill="none" stroke="#00FFFF" stroke-width="1" />
  <rect x="375" y="15" width="10" height="10" fill="none" stroke="#00FFFF" stroke-width="1" />
  <rect x="15" y="115" width="10" height="10" fill="none" stroke="#00FFFF" stroke-width="1" />
  <rect x="375" y="115" width="10" height="10" fill="none" stroke="#00FFFF" stroke-width="1" />
  
  <text x="200" y="28" font-family="monospace" font-size="14" fill="#00FFFF" text-anchor="middle" font-weight="bold" letter-spacing="2">TOP_LANGUAGES</text>
  <line x1="50" y1="38" x2="350" y2="38" stroke="#FF00FF" stroke-width="1" opacity="0.5" />
  <line x1="50" y1="40" x2="350" y2="40" stroke="#FF00FF" stroke-width="1" opacity="0.3" stroke-dasharray="2 2" />

  <circle cx="130" cy="85" r="35" fill="none" stroke="#00FF94" stroke-width="16" stroke-dasharray="67.66501538461539 219.91129999999998" transform="rotate(-90 130 85)" filter="url(#glow)" />

  <rect x="230" y="49" width="10" height="10" rx="2" fill="#00FF94">
    <animate attributeName="opacity" values="0.7;1;0.7" dur="2s" repeatCount="indefinite" />
  </rect>
  <text x="248" y="57" font-family="monospace" font-size="11" fill="#F0F6FC">Python</text>
  <text x="380" y="57" font-family="monospace" font-size="11" fill="#8B949E" text-anchor="end">31%</text>

  <circle cx="130" cy="85" r="35" fill="none" stroke="#1572B6" stroke-width="16" stroke-dasharray="67.66501538461539 219.91129999999998" transform="rotate(20.769230769230774 130 85)" filter="url(#glow)" />

  <rect x="230" y="67" width="10" height="10" rx="2" fill="#1572B6">
    <animate attributeName="opacity" values="0.7;1;0.7" dur="2s" repeatCount="indefinite" />
  </rect>
  <text x="248" y="75" font-family="monospace" font-size="11" fill="#F0F6FC">CSS</text>
  <text x="380" y="75" font-family="monospace" font-size="11" fill="#8B949E" text-anchor="end">31%</text>

  <circle cx="130" cy="85" r="35" fill="none" stroke="#FF00FF" stroke-width="16" stroke-dasharray="50.74876153846154 219.91129999999998" transform="rotate(131.53846153846155 130 85)" filter="url(#glow)" />

  <rect x="230" y="85" width="10" height="10" rx="2" fill="#FF00FF">
    <animate attributeName="opacity" values="0.7;1;0.7" dur="2s" repeatCount="indefinite" />
  </rect>
  <text x="248" y="93" font-family="monospace" font-size="11" fill="#F0F6FC">JavaScript</text>
  <text x="380" y="93" font-family="monospace" font-size="11" fill="#8B949E" text-anchor="end">23%</text>

  <circle cx="130" cy="85" r="35" fill="none" stroke="#FFD43B" stroke-width="16" stroke-dasharray="16.916253846153847 219.91129999999998" transform="rotate(214.61538461538464 130 85)" filter="url(#glow)" />

  <rect x="230" y="103" width="10" height="10" rx="2" fill="#FFD43B">
    <animate attributeName="opacity" values="0.7;1;0.7" dur="2s" repeatCount="indefinite" />
  </rect>
  <text x="248" y="111" font-family="monospace" font-size="11" fill="#F0F6FC">C++</text>
  <text x="380" y="111" font-family="monospace" font-size="11" fill="#8B949E" text-anchor="end">8%</text>

  <circle cx="130" cy="85" r="35" fill="none" stroke="#E34F26" stroke-width="16" stroke-dasharray="16.916253846153847 219.91129999999998" transform="rotate(242.30769230769232 130 85)" filter="url(#glow)" />

  <rect x="230" y="121" width="10" height="10" rx="2" fill="#E34F26">
    <animate attributeName="opacity" values="0.7;1;0.7" dur="2s" repeatCount="indefinite" />
  </rect>
  <text x="248" y="129" font-family="monospace" font-size="11" fill="#F0F6FC">HTML</text>
  <text x="380" y="129" font-family="monospace" font-size="11" fill="#8B949E" text-anchor="end">8%</text>

  <!-- Linha de dados animada -->
  <line x1="50" y1="125" x2="350" y2="125" stroke="#00FFFF" stroke-width="1" opacity="0.3" />
  <rect x="50" y="125" width="80" height="1" fill="#00FFFF">
    <animate attributeName="x" values="50;350;50" dur="3s" repeatCount="indefinite" />
  </rect>
  
  <!-- Pixels decorativos -->
  <g opacity="0.4">
    <rect x="30" y="20" width="2" height="2" fill="#00FFFF">
      <animate attributeName="opacity" values="0.4;1;0.4" dur="1.5s" repeatCount="indefinite" />
    </rect>
    <rect x="368" y="20" width="2" height="2" fill="#00FFFF">
      <animate attributeName="opacity" values="0.4;1;0.4" dur="1.5s" repeatCount="indefinite" begin="0.5s" />
    </rect>
    <rect x="30" y="110" width="2" height="2" fill="#00FFFF">
      <animate attributeName="opacity" values="0.4;1;0.4" dur="1.5s" repeatCount="indefinite" begin="1s" />
    </rect>
    <rect x="368" y="110" width="2" height="2" fill="#00FFFF">
      <animate attributeName="opacity" values="0.4;1;0.4" dur="1.5s" repeatCount="indefinite" begin="1.5s" />
    </rect>
  </g>
  
  <!-- Gatinho discreto -->
  <text x="370" y="20" font-family="monospace" font-size="8" fill="#30363D" opacity="0.2">=^..^=</text>
</svg>